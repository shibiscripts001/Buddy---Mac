# Builds and publishes the macOS installer, Buddy-<version>.pkg. Runs when
# VERSION (or this file) changes on main, and by hand (Actions > Release >
# Run workflow); a version that's already released is skipped, so bump
# VERSION to release again.
#
# It builds from the repo alone on a clean Mac: build_mac_installer.py makes
# buddy.zip and the .pkg with pkgbuild/productbuild, which every macOS has.

name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The token isn't left in .git/config for the steps that install
          # packages and run code; only the gh steps get it (GH_TOKEN).
          persist-credentials: false

      - name: Read VERSION
        id: version
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must look like 1.2.3 (got '$v')"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.version.outputs.version }} already exists - bump VERSION to release again."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.exists.outputs.skip == 'false'
        with:
          python-version: "3.13"

      - name: Run the tests
        if: steps.exists.outputs.skip == 'false'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --disable-pip-version-check --progress-bar off -r installer/requirements.txt
          python tests/run_suite.py -v

      - name: Build the installer
        if: steps.exists.outputs.skip == 'false'
        run: python build_mac_installer.py

      - name: Publish the release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          pkg="dist/Buddy-$v.pkg"
          sha="$(shasum -a 256 "$pkg" | cut -d ' ' -f 1)"
          cat > notes.md <<EOF
          **To install:** download Buddy-$v.pkg below and open it. Then open DaVinci Resolve and choose Workspace > Scripts > Buddy.

          The installer isn't signed, so macOS blocks it the first time: open System Settings > Privacy & Security and click Open Anyway. Only ever download it from this page. It installs Python and the packages Buddy needs if the Mac doesn't have them yet.

          SHA-256 of Buddy-$v.pkg: \`$sha\` - to check a download, run \`shasum -a 256 Buddy-$v.pkg\` in Terminal and compare.
          EOF
          gh release create "v$v" "$pkg" --title "Buddy $v for macOS" --notes-file notes.md --generate-notes --target "$GITHUB_SHA"
